[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "papertrail"
version = "0.1.0"
description = "Marker JSON -> section tree -> classification -> wiki -> SQLite/FTS -> web UI + MCP, for any corpus of documents that cite each other."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
    "tqdm>=4.66",
    "openai>=1.0",
    # core/renderer.py does `import markdown` at module level. mcp/server.py
    # imports core.registry -> core.renderer at module level too (CorpusRegistry
    # is needed for validate_answer/publish_answer, not just HTML rendering) —
    # so `pip install papertrail[mcp]` without `[web]` still needs this or
    # `import papertrail.mcp.server` raises ModuleNotFoundError. Belongs in
    # core deps, not the web extra, until that import is made lazy.
    "markdown>=3.5",
    # topic_pages.py's parse_response() falls back to this when SYNTH_MODEL's
    # JSON has a stray brace/unescaped quote at an unpredictable position in
    # long free-text prose (observed on live Claude-via-gateway output; no
    # fixed pattern to regex around -- see that function's docstring). Its
    # output is never trusted blindly: validate_topic() still enforces
    # dict-shape/non-empty prose/citations before a repair is accepted.
    "json-repair>=0.63",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]
mcp = [
    # mcp_server.py uses mcp.server.mcpserver.MCPServer + run(transport=,
    # stateless_http=) — documented as 2.x-only, incompatible with 1.x's
    # mcp.server.fastmcp.FastMCP. A bare >=2 would break silently on 3.x.
    "mcp>=2.0,<3",
]
datalab = ["requests>=2.31"]
agent = [
    # create_agent is backed by LangGraph; the MCP extra supplies the current
    # FastMCP-based adapter (the older langchain-mcp-adapters package is retired).
    "langchain[mcp]>=1.4,<2",
    "langchain-openai>=1.6,<2",
]
codex = ["openai-codex>=0.154,<0.155"]
all = ["papertrail[web,mcp,datalab,agent,codex]"]
dev = ["pytest>=8", "ruff"]

[project.scripts]
papertrail = "papertrail.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/papertrail"]
